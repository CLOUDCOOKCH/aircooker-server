[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "aircooker-server"
version = "0.1.0"
requires-python = ">=3.12"
description = "Self-hosted household meal planning"
license = "Apache-2.0"
dependencies = ["fastapi==0.141.1", "pydantic==2.13.4", "uvicorn==0.52.1", "argon2-cffi==25.1.0", "httpx==0.28.1", "bring-api==1.1.2", "cryptography==50.0.0"]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1", "mypy==1.18.2"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
aircooker = ["migrations/*.sql", "web/*"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
