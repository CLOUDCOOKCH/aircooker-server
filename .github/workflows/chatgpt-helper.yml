name: ChatGPT Windows connector
on:
  pull_request:
    paths: ['src/aircooker/chatgpt_helper.py', 'helper-tests/**', '.github/workflows/chatgpt-helper.yml']
  push:
    branches: [main]
    paths: ['src/aircooker/chatgpt_helper.py', 'helper-tests/**', '.github/workflows/chatgpt-helper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-windows:
    timeout-minutes: 5
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python helper-tests/test_connector.py
