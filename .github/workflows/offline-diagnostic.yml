name: Isolated WebKit offline diagnostic
on:
  push:
    branches: ['test/shopping-offline-diagnostic']
permissions:
  contents: read
jobs:
  webkit:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes -r requirements-browser.lock
          python -m pip install --no-deps -e .
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --ignore-scripts --no-fund
      - run: npm --prefix frontend run build
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu
      - run: timeout 600s python -m playwright install --with-deps webkit
      - name: Real trusted TLS and actual backend outage diagnostics
        run: |
          python scripts/browser_test_tls.py "$RUNNER_TEMP/mealf-browser-tls"
          sudo install -m 644 "$RUNNER_TEMP/mealf-browser-tls/ca.crt" /usr/local/share/ca-certificates/mealf-browser-test.crt
          sudo update-ca-certificates
          timeout 180s env PYTHONUNBUFFERED=1 MEALF_BROWSER_TEST_TLS="$RUNNER_TEMP/mealf-browser-tls" MEALF_LAYOUT_ENGINE=webkit python scripts/image_import_browser_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-diagnostic
          path: build/image-import-browser
