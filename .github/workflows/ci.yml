name: Backend checks
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pwa-core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run api:generate
      - run: git diff --exit-code -- src/api-schema.d.ts
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  checks:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy src/mealf --ignore-missing-imports
      - run: python scripts/license_inventory.py --check
      - run: python scripts/build_brand_assets.py --check
      - run: python -m pytest -q --junitxml=build/tests.xml
      - run: python scripts/export_contract.py --check
      - run: docker build -t mealf-server:development .
      - run: python scripts/docker_smoke.py
      - run: timeout 180s python scripts/operator_docker_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-tests-${{ matrix.runner }}
          path: |
            build/tests.xml
            build/runtime-licenses.json
  browser:
    runs-on: ubuntu-24.04
    # Match requirements-browser.lock. The official test image already contains
    # both browser engines and their system libraries; no per-run WebKit apt
    # download is needed. This container never becomes the production image.
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d
      options: --shm-size=1g
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes -r requirements-browser.lock
          python -m pip install --no-deps -e .
      - name: Verify pinned browser engines and expose Chromium to smoke scripts
        shell: bash
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          assert version("playwright") == "1.62.0", "Update the CI image with the browser lock"
          with sync_playwright() as browsers:
              for engine in (browsers.chromium, browsers.webkit):
                  assert Path(engine.executable_path).is_file(), engine.executable_path
              Path("/usr/local/bin/chromium").symlink_to(browsers.chromium.executable_path)
          PY
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --ignore-scripts --no-fund
      - run: npm --prefix frontend run build
      - run: apt-get update -qq && apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu
      - name: Exercise PWA offline and device workflows in installed Chrome
        env:
          MEALF_SCREENSHOT_DIR: build/pwa-browser
          MEALF_CAPTURE: '1'
        run: python scripts/pwa_browser_smoke.py
      - name: Exercise image/PDF imports and provider settings with synthetic cloud responses
        run: python scripts/ai_import_browser_smoke.py
      - name: Personal ChatGPT connection and recipe import (synthetic OpenAI)
        run: timeout 180s python scripts/chatgpt_browser_smoke.py
      - name: Recipe ideas, explicit review and offline save (synthetic provider HTTP)
        run: timeout 180s python scripts/recipe_ideas_browser_smoke.py
      - name: Pantry and food taste onboarding with synthetic provider HTTP
        env:
          MEALF_CAPTURE: '1'
        run: |
          timeout 180s python scripts/food_setup_browser_smoke.py
          python scripts/browser_test_tls.py "$RUNNER_TEMP/mealf-browser-tls"
          install -m 644 "$RUNNER_TEMP/mealf-browser-tls/ca.crt" /usr/local/share/ca-certificates/mealf-browser-test.crt
          update-ca-certificates
          MEALF_BROWSER_TEST_TLS="$RUNNER_TEMP/mealf-browser-tls" MEALF_LAYOUT_ENGINE=webkit MEALF_FOOD_SCREENSHOT_DIR=build/food-setup-browser-webkit timeout 180s python scripts/food_setup_browser_smoke.py
      - name: Sync truthfulness, two devices, recovery and redacted diagnostics
        run: timeout 180s python scripts/sync_status_browser_smoke.py
      - name: PWA task hierarchy, settings disclosures and offline recipe editing
        env:
          MEALF_CAPTURE: '1'
          MEALF_UX_SCREENSHOT_DIR: build/pwa-ux-browser
        run: timeout 180s python scripts/pwa_ux_browser_smoke.py
      - name: Shopping requirements and manual Bring sync with synthetic service
        run: timeout 180s python scripts/shopping_browser_smoke.py
      - name: Recipe fallbacks and reviewed source photos with synthetic network responses
        env:
          MEALF_SCREENSHOT_DIR: build/source-photo-browser
        run: timeout 180s python scripts/source_photo_browser_smoke.py
      - name: Exercise push settings/offline/receiver with explicit delivery doubles
        env:
          MEALF_SCREENSHOT_DIR: build/push-browser
        run: python scripts/push_browser_smoke.py
      - name: Exercise console in installed Chrome
        env:
          MEALF_SCREENSHOT_DIR: build/browser
        run: python scripts/browser_smoke.py
      - name: Exercise phone layout and focus in Chrome and WebKit
        run: |
          python scripts/pwa_layout_smoke.py
          python scripts/theme_browser_smoke.py
          python scripts/image_import_browser_smoke.py
          MEALF_LAYOUT_ENGINE=webkit python scripts/pwa_layout_smoke.py
          MEALF_LAYOUT_ENGINE=webkit python scripts/theme_browser_smoke.py
          timeout 180s env PYTHONUNBUFFERED=1 MEALF_BROWSER_TEST_TLS="$RUNNER_TEMP/mealf-browser-tls" MEALF_LAYOUT_ENGINE=webkit python scripts/image_import_browser_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: console-screenshots
          path: |
            build/browser
            build/pwa-browser
            build/push-browser
            build/pwa-layout
            build/ai-import-browser
            build/chatgpt-browser
            build/recipe-ideas-browser
            build/food-setup-browser
            build/food-setup-browser-webkit
            build/sync-status-browser
            build/pwa-ux-browser
            build/shopping-browser
            build/source-photo-browser
            build/theme-browser
            build/image-import-browser
  security:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.9.0
      - run: python -m pip_audit -r requirements.lock --strict
      - name: Scan secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 dir /repo --config /repo/.gitleaks.toml --redact
      - run: docker build -t mealf-server:scan .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          version: v0.70.0
          image-ref: mealf-server:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: json
          output: container-security.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-security-${{ matrix.runner }}
          path: container-security.json
