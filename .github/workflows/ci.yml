name: Backend checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pwa-core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run api:generate
      - run: git diff --exit-code -- src/api-schema.d.ts
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  checks:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy src/aircooker --ignore-missing-imports
      - run: python scripts/license_inventory.py --check
      - run: python scripts/build_brand_assets.py --check
      - run: python -m pytest -q --junitxml=build/tests.xml
      - run: python scripts/export_contract.py --check
      - run: docker build -t aircooker-server:development .
      - run: python scripts/docker_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-tests-${{ matrix.runner }}
          path: |
            build/tests.xml
            build/runtime-licenses.json
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes -r requirements-browser.lock
          python -m pip install --no-deps -e .
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --ignore-scripts --no-fund
      - run: npm --prefix frontend run build
      - name: Exercise PWA offline and device workflows in installed Chrome
        env:
          AIRCOOKER_SCREENSHOT_DIR: build/pwa-browser
          AIRCOOKER_CAPTURE: '1'
        run: python scripts/pwa_browser_smoke.py
      - name: Exercise push settings/offline/receiver with explicit delivery doubles
        env:
          AIRCOOKER_SCREENSHOT_DIR: build/push-browser
        run: python scripts/push_browser_smoke.py
      - name: Exercise console in installed Chrome
        env:
          AIRCOOKER_SCREENSHOT_DIR: build/browser
        run: python scripts/browser_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: console-screenshots
          path: |
            build/browser
            build/pwa-browser
            build/push-browser
  security:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.9.0
      - run: python -m pip_audit -r requirements.lock --strict
      - name: Scan secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 dir /repo --config /repo/.gitleaks.toml --redact
      - run: docker build -t aircooker-server:scan .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          version: v0.70.0
          image-ref: aircooker-server:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: json
          output: container-security.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-security-${{ matrix.runner }}
          path: container-security.json
