<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>aircooker · household console</title><link rel="stylesheet" href="/console.css"><script src="/console.js" defer></script></head>
<body><main><header><span class="mark" aria-hidden="true">a.</span><h1 data-i18n="title">Your household, at a glance.</h1><select id="language" aria-label="Language"><option value="en">English</option><option value="de">Deutsch</option></select></header>
<p id="status" role="status" aria-live="polite"></p><section id="identity"></section><section id="authentication"><h2 data-i18n="connect"></h2><form id="login"><label><span data-i18n="username"></span><input name="username" type="text" autocomplete="username" required maxlength="100"></label><label><span data-i18n="password"></span><input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><div id="setup-fields" hidden><label><span data-i18n="token"></span><input name="token" type="text" autocomplete="off"></label><label><span data-i18n="household"></span><input name="name" type="text" value="My kitchen" maxlength="100"></label><label><span data-i18n="timezone"></span><input name="timezone" type="text" value="Europe/Zurich"></label></div><button type="submit" data-i18n="continue"></button></form></section>
<section id="dashboard" hidden><div class="section-head"><h2 data-i18n="overview"></h2><button id="logout" class="secondary" type="button" data-i18n="logout"></button></div><div id="metrics" class="metrics"></div><p id="storage" class="muted"></p><h2 data-i18n="jobs"></h2><div id="jobs"></div><div class="actions"><button id="reload" type="button" data-i18n="refresh"></button></div><details><summary data-i18n="household_settings"></summary><form id="household-form"><label><span data-i18n="household"></span><input name="name" type="text" required maxlength="100"></label><label><span data-i18n="timezone"></span><input name="timezone" type="text" required placeholder="Europe/Zurich"></label><label><span data-i18n="default_language"></span><select name="language"><option value="en">English</option><option value="de">Deutsch</option></select></label><button type="submit" data-i18n="save"></button></form></details><details><summary data-i18n="security"></summary><h3 data-i18n="sessions"></h3><div id="sessions"></div><form id="password-form"><label><span data-i18n="current_password"></span><input name="current_password" type="password" autocomplete="current-password" required maxlength="1024"></label><label><span data-i18n="new_password"></span><input name="new_password" type="password" autocomplete="new-password" required minlength="12" maxlength="1024"></label><p class="muted" data-i18n="password_hint"></p><button type="submit" data-i18n="change_password"></button></form></details><details><summary data-i18n="ai_settings"></summary><p class="muted" data-i18n="ai_disclosure"></p><form id="ai-form"><label class="check"><input type="checkbox" name="enabled" ><span data-i18n="ai_enable"></span></label><label><span data-i18n="provider"></span><select name="provider" data-ai-option><option value="openai">OpenAI</option><option value="openai-compatible">OpenAI-compatible</option><option value="anthropic">Anthropic</option><option value="ollama">Ollama</option><option value="openwebui">OpenWebUI</option></select></label><label><span data-i18n="base_url"></span><input name="base_url" type="url" value="https://api.openai.com/v1" required maxlength="2048" data-ai-option></label><label><span data-i18n="model"></span><input name="model" type="text" required maxlength="200" data-ai-option></label><label><span data-i18n="api_key"></span><input name="api_key" type="password" autocomplete="off" maxlength="8192" data-ai-option></label><p id="ai-key-status" class="muted"></p><p class="muted" data-i18n="key_hint"></p><label class="check"><input type="checkbox" name="clear_key" data-ai-option><span data-i18n="clear_key"></span></label><label><span data-i18n="timeout"></span><input name="timeout" type="number" value="30" required min="1" max="120" data-ai-option></label><label><span data-i18n="content_limit"></span><input name="max_content" type="number" value="50000" required min="100" max="100000" data-ai-option></label><label><span data-i18n="request_limit"></span><input name="requests_per_hour" type="number" value="20" required min="1" max="1000" data-ai-option></label><label class="check"><input type="checkbox" name="structured_output" data-ai-option><span data-i18n="structured"></span></label><label class="check"><input type="checkbox" name="allow_local_http" data-ai-option><span data-i18n="local_http"></span></label><button type="submit" data-i18n="save"></button></form><p class="muted" data-i18n="ai_test_hint"></p><button type="button" id="ai-test" class="secondary" data-i18n="ai_test"></button></details><details><summary data-i18n="bring_settings"></summary><p class="muted" data-i18n="bring_warning"></p><p id="bring-state" role="status"></p><form id="bring-form"><label><span data-i18n="bring_email"></span><input name="email" type="email" required autocomplete="username" maxlength="254"></label><label><span data-i18n="bring_password"></span><input name="password" type="password" required autocomplete="current-password" maxlength="1024"></label><button type="submit" data-i18n="bring_save"></button></form><div class="actions"><button type="button" id="bring-test" class="secondary" data-i18n="bring_test"></button></div><label><span data-i18n="bring_list"></span><select id="bring-list"></select></label><div class="actions"><button type="button" id="bring-select" disabled data-i18n="bring_select"></button><button type="button" id="bring-retry" class="secondary" data-i18n="bring_retry"></button><button type="button" id="bring-disconnect" class="secondary" data-i18n="disconnect"></button></div></details><details><summary data-i18n="data_management"></summary><p class="muted" data-i18n="import_hint"></p><button id="export" type="button" class="secondary" data-i18n="export"></button><form id="import-form"><label><span data-i18n="archive_file"></span><input id="import-file" type="file" accept=".json,.zip,application/json,application/zip" required></label><button type="submit" data-i18n="import_data"></button></form></details><p class="muted" data-i18n="limitations"></p></section><footer>aircooker · Independent open-source meal planning</footer></main></body></html>
