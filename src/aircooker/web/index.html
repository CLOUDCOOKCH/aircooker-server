<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>aircooker · household console</title><link rel="stylesheet" href="/console.css"><script src="/console.js" defer></script></head><body><main><header><span class="mark" aria-hidden="true">a.</span><div><p class="eyebrow">AIRCOOKER</p><h1 data-i18n="title">Your household, at a glance.</h1></div><select id="language" aria-label="Language"><option value="en">English</option><option value="de">Deutsch</option></select></header><p id="status" role="status" aria-live="polite"></p><section id="identity"></section><section id="authentication"><h2 data-i18n="connect">Connect to your kitchen</h2><form id="login"><label><span data-i18n="username">Username</span><input name="username" autocomplete="username" required maxlength="100"></label><label><span data-i18n="password">Password</span><input type="password" name="password" autocomplete="current-password" required maxlength="1024"></label><div id="setup-fields" hidden><label><span data-i18n="token">Container setup token</span><input name="token" autocomplete="off"></label><label><span data-i18n="household">Household name</span><input name="name" value="My kitchen"></label><label><span data-i18n="timezone">Time zone</span><input name="timezone" value="Europe/Zurich"></label></div><button type="submit" data-i18n="continue">Continue</button></form></section><section id="dashboard" hidden><div class="section-head"><h2 data-i18n="overview">Kitchen overview</h2><button id="logout" class="secondary" data-i18n="logout">Sign out</button></div><div id="metrics" class="metrics"></div><h2 data-i18n="jobs">Recent background jobs</h2><div id="jobs"></div><div class="actions"><button id="reload" data-i18n="refresh">Refresh</button><button id="export" class="secondary" data-i18n="export">Export household data</button></div><p class="muted" data-i18n="limitations">Bring! and AI connections are not yet enabled in this development release.</p></section><footer>aircooker · Independent open-source meal planning</footer></main></body></html>
